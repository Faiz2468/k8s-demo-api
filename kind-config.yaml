# Local Kubernetes cluster config for kind.
# Maps the NodePort (30080) to your machine's localhost so the app
# is reachable without extra port-forwarding.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
